# =============================================
# Render.com Infrastructure-as-Code Blueprint
#
# How to use:
#   1. Push this file to your GitHub repo root.
#   2. Go to render.com → New → Blueprint.
#   3. Connect your repo — Render will auto-read this file.
# =============================================

services:
  # ──────────────────────────────────────────
  # Backend Web Service (Free tier)
  # ──────────────────────────────────────────
  - type: web
    name: pms-backend
    runtime: node
    plan: free
    region: oregon     # or: frankfurt, singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    autoDeploy: true   # auto-deploy on every git push to main

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      # Paste your Neon/Supabase connection string here
      - key: DATABASE_URL
        sync: false    # marks as secret — set manually in Render dashboard

      # Upstash Redis (free): https://console.upstash.com
      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Your Vercel frontend URL (fill in after frontend is deployed)
      - key: FRONTEND_URL
        sync: false

      - key: EMAIL_HOST
        sync: false

      - key: EMAIL_PORT
        value: 587

      - key: EMAIL_SECURE
        value: false

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: LOG_LEVEL
        value: info
